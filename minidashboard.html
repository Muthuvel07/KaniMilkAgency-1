<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Campus Security Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1f4d; --bg: #f4f6fb; --card: #ffffff; --border: #e3e8f0;
    --text: #1a2233; --text-muted: #6b7688;
    --green: #16a34a; --green-bg: #dcfce7; --red: #dc2626; --red-bg: #fee2e2;
    --amber: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 18px; }
  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .topbar h1 { font-size: 1.25rem; color: var(--navy); }
  .topbar .live { font-size: 0.75rem; color: var(--text-muted); }

  .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
  .stat-card .num { font-size: 1.6rem; font-weight: 700; }
  .stat-card.authorized .num { color: var(--green); }
  .stat-card.unauthorized .num { color: var(--red); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.92rem; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: left; padding: 8px 16px; color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; background: #fafbfd; }
  td { padding: 8px 16px; border-top: 1px solid var(--border); }
  .status-pill { font-size: 0.68rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .status-pill.authorized { background: var(--green-bg); color: var(--green); }
  .status-pill.unauthorized { background: var(--red-bg); color: var(--red); }
  .log-img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; background: #eee; }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 16px; }
  .table-scroll { max-height: 260px; overflow-y: auto; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Mini Campus Dashboard</h1>
    <span class="live" id="lastUpdated">Live</span>
  </div>

  <div class="stats-row">
    <div class="stat-card authorized"><div class="label">Authorized Today</div><div class="num" id="statAuthorized">--</div></div>
    <div class="stat-card unauthorized"><div class="label">Unauthorized Today</div><div class="num" id="statUnauthorized">--</div></div>
  </div>

  <div class="panel">
    <div class="panel-header">Attendance</div>
    <div class="table-scroll">
      <table><thead><tr><th>ID</th><th>Name</th><th>Time</th><th>Status</th></tr></thead>
      <tbody id="attendanceBody"><tr class="empty-row"><td colspan="4">Waiting for data...</td></tr></tbody></table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Unauthorized Detections</div>
    <div class="table-scroll">
      <table><thead><tr><th>Image</th><th>Name</th><th>Time</th></tr></thead>
      <tbody id="unauthorizedBody"><tr class="empty-row"><td colspan="3">Waiting for data...</td></tr></tbody></table>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase-config.js"></script>

<script>
  const PI_IMAGE_BASE_URL = "http://192.168.1.50:5000"; // <-- replace with your Pi's local IP, if using camera images

  function tick() {
    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
  }
  setInterval(tick, 1000);
  tick();

  let authorizedCount = 0, unauthorizedCount = 0;

  db.ref('/Attendance').on('value', (snap) => {
    const data = snap.val() || {};
    const rows = Object.values(data).sort((a, b) => (b.time || '').localeCompare(a.time || ''));
    authorizedCount = rows.length;
    document.getElementById('statAuthorized').textContent = authorizedCount;

    const body = document.getElementById('attendanceBody');
    if (rows.length === 0) {
      body.innerHTML = '<tr class="empty-row"><td colspan="4">No attendance yet.</td></tr>';
      return;
    }
    body.innerHTML = rows.slice(0, 20).map(r => `
      <tr>
        <td>${r.id || '--'}</td>
        <td>${r.name || 'Unknown'}</td>
        <td>${r.time || '--'}</td>
        <td><span class="status-pill authorized">Authorized</span></td>
      </tr>
    `).join('');
  });

  db.ref('/Unauthorized').on('value', (snap) => {
    const data = snap.val() || {};
    const rows = Object.values(data).sort((a, b) => (b.time || '').localeCompare(a.time || ''));
    unauthorizedCount = rows.length;
    document.getElementById('statUnauthorized').textContent = unauthorizedCount;

    const body = document.getElementById('unauthorizedBody');
    if (rows.length === 0) {
      body.innerHTML = '<tr class="empty-row"><td colspan="3">No unauthorized detections yet.</td></tr>';
      return;
    }
    body.innerHTML = rows.slice(0, 20).map(r => `
      <tr>
        <td><img class="log-img" src="${r.imagePath ? PI_IMAGE_BASE_URL + '/' + r.imagePath : ''}" onerror="this.style.display='none'"></td>
        <td>${r.name || 'Unknown'}</td>
        <td>${r.time || '--'}</td>
      </tr>
    `).join('');
  });
</script>
</body>
</html>
